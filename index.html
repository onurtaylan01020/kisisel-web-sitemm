<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onur'un Kişisel Web Sitesi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 50px 20px;
            background: #1e293b;
        }

        h1 {
            color: #38bdf8;
            font-size: 36px;
        }

        section {
            padding: 30px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 15px;
        }

        footer {
            padding: 20px;
            background: #1e293b;
        }

        a {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Merhaba, Ben Onur!</h1>
        <p>Kişisel Web Siteme Hoş Geldiniz</p>
    </header>

    <section>
        <div class="card">
            <h2>Hakkımda</h2>
            <p>Merhaba! Ben Onur. Teknolojiye ve yazılıma ilgi duyuyorum.</p>
        </div>

        <div class="card">
            <h2>Projelerim</h2>
            <p>Bu web sitesi benim ilk GitHub projemdir.</p>
        </div>

        <div class="card">
            <h2>İletişim</h2>
            <p>Kişisel web sitem üzerinden beni tanıyabilirsiniz.</p>
        </div>
    </section>

    <footer>
        <p>© 2026 Onur - Kişisel Web Sitem</p>
    </footer>

</body>
</html>
